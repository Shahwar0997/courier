# .github/workflows/checks.yml — your repo's CI.
#
# CI ("continuous integration") means: every time you push commits or open a pull request,
# GitHub starts a fresh computer, gets your code, and runs the checks below. Each "job" is one
# stop's checks. You see the result as ✓ or ✗ on your pull request, in its Checks tab.
#
# A stop's checks wait until you've started that stop, and say so. Once started, they stay on,
# so a later change can't quietly break an earlier stop.

name: checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]  # "edited": re-check when you fix the description

permissions:
  contents: read

jobs:
  stop-01:
    name: "stop-01 · your robot and your PR"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: robot.json is filled in
        run: python checks/check_robot_json.py
      - name: explain-back is written (pull requests only)
        # Checked in your copy of the template, not in the template repo itself.
        if: github.event_name == 'pull_request' && github.repository != 'curiousims/courier'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python checks/check_explain_back.py

  stop-02:
    name: "stop-02 · route planner tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - name: planner tests
        run: python checks/check_stop_02.py
      - name: your robot drives the planner's route (simulator)
        # Skipped until planner/plan.py prints a route. Same engine as the Stop 2 sim (tools/courier/).
        run: |
          route=$(python3 planner/plan.py maps/office.txt)
          case "$route" in
            ""|*[!NESW]*) echo "Stop 2 not started yet (no route printed): skipping the replay."; exit 0 ;;
          esac
          name=$(python3 -c "import json; print(json.load(open('robot.json')).get('name') or 'Your robot')")
          node tools/courier/cli.mjs drive "$route" --map maps/office.txt --name "$name"

  stop-03:
    name: "stop-03 · firmware"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: firmware builds (pio run -e sim; from Stop 4, the simulator's compiler)
        # From Stop 4 your firmware includes courier.h, which only the simulator's compiler has (#13).
        run: python checks/check_stop_03.py --build
      - name: firmware says hello, lights the LED (blinks, at Stop 3), and has your planner's route
        run: python checks/check_stop_03.py
      - name: your firmware drives the robot (simulator, 30 s of robot time)
        # Same engine as the Stop 3 sim. Writes the event log check_stop_03.py can read (#4). From Stop 5 the
        # real-world switch stays on, and arriving with it on is a warning for now (checks/drive_office.py).
        run: python checks/drive_office.py

  stop-04:
    name: "stop-04 · sense and react"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: split into files, builds; still delivers, stops for the box, steady under noise, keeps looking (simulator)
        # The box at row 4, column 8 until 12 s; sensor noise on seeds 1–3 (courier 0.8's --box and --noise sensor).
        # From Stop 5: the real-world switch on (seeds 1–3), the box on the straight test drive, timed to meet Pip;
        # arriving on the office route is a warning for now.
        run: python checks/check_stop_04.py

  stop-05:
    name: "stop-05 · know where you are"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: odometry tests, then the square and ten tiles straight with the real-world switch on, seeds 1–3 (simulator)
        # courier 0.9's --square and --straight 10 test drives. Steady speed isn't checked until its limit is
        # re-measured (STEADY_ENFORCED in checks/check_stop_05.py). No office route: see Stop 5's design.
        run: python checks/check_stop_05.py

  stop-06:
    name: "stop-06 · talk to the robot"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: courier tool and planner tests, then your firmware over TCP (simulator, real time)
        # Runs the robot with --listen on localhost:7000 for about a minute.
        run: python checks/check_stop_06.py

  stop-17:
    name: "stop-17 · over-the-air updates (early check)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: boots cleanly with two slots, a key and a bucket (simulator)
        # Early version until Stop 17 is designed; passes as "hasn't started" until the firmware uses courier::ota.
        run: python checks/check_stop_17.py

  stop-18:
    name: "stop-18 · a hundred robots (early check)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: 10 robots together on an in-memory broker (simulator)
        # Early version until Stop 18 is designed; passes as "hasn't started" until the firmware uses courier::mqtt.
        run: python checks/check_stop_18.py
