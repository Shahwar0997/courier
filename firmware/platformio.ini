; firmware/platformio.ini — tells PlatformIO how to build your robot's firmware.
;
; There are two "environments" (build targets) for your firmware. Your main.cpp is the same for both:
;   sim  builds for the simulator, on the computer you're working on:  pio run -e sim
;        (Stop 3 only: from Stop 4 your firmware uses courier.h, so `npm run sim` builds it)
;   kit  builds for the real ESP32 robot (optional Stop 24):           pio run -e kit
; Only the pin numbers differ, and those live in lib/courier/courier_pins.h.
; A third, native, runs the tests in test/ on this computer (from Stop 5): pio test -e native

[platformio]
default_envs = sim

[env:sim]
; "native" means: compile for this computer instead of a microcontroller. lib/arduino_sim
; stands in for the ESP32's Arduino functions (Serial, pins, delay) and runs in robot time.
platform = native@1.2.1
build_flags = -std=gnu++17 -DCOURIER_SIM
; Libraries PlatformIO downloads for you, at an exact version. ArduinoJson reads and writes
; JSON messages (Stop 6). A library is only built into your firmware once your code includes it.
lib_deps = bblanchon/ArduinoJson@7.4.3

[env:kit]
; The real robot. The board is a placeholder until the kit is chosen.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.3
lib_ignore = arduino_sim

[env:native]
; Host-side tests (Stop 5): runs test/ on this computer with Unity, without the Arduino stand-in,
; so only code with no hardware calls (like lib/odometry) is tested here.
platform = native@1.2.1
build_flags = -std=gnu++17
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
lib_ignore = arduino_sim, courier
